<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Worthfolio</title>
  <desc id="desc">A serif W raised from a floating rounded ivory stone tile</desc>
